<!doctype html>
<!--
  Source for src/assets/og.png — the link-preview card.

  Rendered by hand rather than by the build: it is a picture of the app, it
  changes only when the screenshots do, and rendering it needs a browser the
  build does not otherwise want. Re-render it whenever the screenshots under
  src/assets/screens are recaptured.

      npx nx run @fridgeezy/site:build          # writes dist/ (fonts, screens)
      cp apps/site/tools/og-template.html apps/site/dist/__og.html
      (cd apps/site/dist && python3 -m http.server 8777 &)
      "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
        --headless=new --disable-gpu --hide-scrollbars \
        --window-size=1200,630 --virtual-time-budget=5000 \
        --screenshot=apps/site/src/assets/og.png \
        "http://127.0.0.1:8777/__og.html"
      rm apps/site/dist/__og.html

  It is copied into dist rather than served from here because the fonts and the
  screenshots are addressed absolutely, off the same origin — the template has
  to be served by something, and dist is the thing already serving them.

  1200x630 is what Open Graph and Twitter summary_large_image expect. The type
  scale, the palette and the two washes are the landing page's own — a preview
  card that does not look like the page it links to is a preview of somewhere
  else.
-->
<meta charset="utf-8">
<style>
@font-face{font-family:'Poppins';font-weight:700;src:url(http://127.0.0.1:8777/assets/fonts/poppins-700.woff2) format('woff2')}
@font-face{font-family:'Poppins';font-weight:600;src:url(http://127.0.0.1:8777/assets/fonts/poppins-600.woff2) format('woff2')}
@font-face{font-family:'Poppins';font-weight:400;src:url(http://127.0.0.1:8777/assets/fonts/poppins-400.woff2) format('woff2')}
@font-face{font-family:'Lora';font-style:italic;font-weight:600;src:url(http://127.0.0.1:8777/assets/fonts/lora-600-italic.woff2) format('woff2')}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;background:#FDFBF9;font-family:'Poppins',sans-serif;position:relative}
.wash{position:absolute;border-radius:50%}
.w1{background:radial-gradient(circle,#F0F7F2 0%,rgba(240,247,242,0) 70%);width:900px;height:900px;right:-180px;top:-330px}
.w2{background:radial-gradient(circle,#FFF5EE 0%,rgba(255,245,238,0) 70%);width:660px;height:660px;left:-230px;top:220px}
.copy{position:absolute;left:72px;top:150px;width:470px;z-index:2}
.mark{font-size:14px;font-weight:600;letter-spacing:.24em;color:#3A332F;margin-bottom:26px}
h1{font-size:60px;line-height:1.08;letter-spacing:-.8px;color:#3A332F;font-weight:700}
h1 em{font-family:'Lora',serif;font-style:italic;font-weight:600;color:#3F7A58;display:block}
p{margin-top:22px;font-size:20px;line-height:1.5;color:#8A8380;font-weight:400}
.stage{position:absolute;right:-24px;top:0;height:630px;width:648px;z-index:1}
.phone{position:absolute;background:#1B1917;border-radius:44px;padding:8px;
  box-shadow:0 26px 60px rgba(6,6,6,.18)}
.phone img{display:block;border-radius:37px;width:100%;height:100%;object-fit:cover;object-position:top center}
.p1{width:222px;height:482px;left:0;top:118px;transform:rotate(-7deg)}
.p2{width:252px;height:548px;left:178px;top:62px;z-index:3}
.p3{width:222px;height:482px;left:432px;top:118px;transform:rotate(7deg)}
</style>
<div class="wash w1"></div><div class="wash w2"></div>
<div class="copy">
  <div class="mark">FRIDGEEZY</div>
  <h1>Cook something<em>delicious.</em></h1>
  <p>Your fridge, tonight's dinner, and a whole menu when one dish isn't enough.</p>
</div>
<div class="stage">
  <div class="phone p1"><img src="http://127.0.0.1:8777/assets/screens/meal.webp"></div>
  <div class="phone p2"><img src="http://127.0.0.1:8777/assets/screens/recipe.webp"></div>
  <div class="phone p3"><img src="http://127.0.0.1:8777/assets/screens/cook.webp"></div>
</div>
